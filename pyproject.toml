# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dedx-erpa"
version = "0.1.0"
description = "Enhanced RPA/LDA ion stopping power from cold matter to high-energy-density plasmas"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "T. A. Mehlhorn" },
  { name = "M. F. Gu" },
  { name = "I. Golovkin" },
]
keywords = [
  "stopping power", "ion stopping", "plasma physics", "warm dense matter",
  "inertial fusion", "high energy density", "ion beams", "RPA", "average atom",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "scipy>=1.14",
  "astropy>=5.0",   # PlasmaPy-compatible units on the public result API
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest>=7"]
docs = ["sphinx", "sphinx-rtd-theme"]
# NOTE: the *compute* pipeline (dedx.py) additionally requires `pfac`, the Python
# interface to FAC (https://github.com/flexible-atomic-code/fac, master branch),
# plus a gfortran build of dedx.f via `make` (see Makefile).  These are not PyPI
# dependencies and are not needed to read results through `dedx_erpa`.

[project.urls]
Homepage = "https://github.com/dedx-erpa/dedx"
Repository = "https://github.com/dedx-erpa/dedx"

[tool.setuptools]
# This is a flat research repo; only ship the new interoperability package.
packages = ["dedx_erpa"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
